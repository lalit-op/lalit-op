<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#020617"
    >

    <meta
        name="description"
        content="Stock Samvad AI - Daily Indian Stock Market Reports"
    >

    <title>
        Stock Samvad AI | Daily Market Reports
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #020617;

        }

        .loading {

            width: 100%;
            height: 100vh;
            height: 100dvh;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            gap: 14px;

            background: #020617;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

        }

        .loading-dot {

            width: 12px;
            height: 12px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 20px
                rgba(34,197,94,0.8);

            animation:
                pulse 1.2s infinite;

        }

        .loading-text {

            color: #64748b;

            font-size: 13px;

            letter-spacing: 0.08em;

            text-transform: uppercase;

        }

        @keyframes pulse {

            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.35);
                opacity: 0.45;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }

        }

    </style>

</head>


<body>


    <div class="loading">

        <div class="loading-dot"></div>

        <div class="loading-text">
            Loading Stock Samvad AI
        </div>

    </div>


    <script>

        window.location.replace("posts/");

    </script>


    <noscript>

        <div class="loading">

            <a
                href="posts/"
                style="
                    color:#38bdf8;
                    text-decoration:none;
                "
            >
                Open Stock Samvad AI
            </a>

        </div>

    </noscript>


</body>

</html>
