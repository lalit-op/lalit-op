<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Daily Market Reports</title>
    
    <style>
        :root {
            /* Fallback background color */
            --bg-color: #0f172a; 
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            /* Use dvh (dynamic viewport height) if supported, fallback to vh */
            height: 100vh;
            height: 100dvh; 
            overflow: hidden; /* Critical: Prevent double scrollbars on mobile */
            background-color: var(--bg-color);
            -webkit-text-size-adjust: 100%; /* Prevent font scaling in landscape mode */
        }

        .fullscreen-iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            /* Ensure smooth scrolling on iOS */
            -webkit-overflow-scrolling: touch; 
        }

        .fullscreen-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            /* Remove tap highlight color on mobile */
            -webkit-tap-highlight-color: transparent; 
        }
    </style>
</head>
<body>
    
    <div class="fullscreen-iframe-container">
        <!-- 
          Crucial settings for mobile compatibility:
          1. No 'sandbox' attribute to maximize permissions.
          2. allow="clipboard-read; clipboard-write; display-capture" for full functionality.
          3. allowfullscreen for potential media elements.
        -->
        <iframe 
            src="https://lalit-op.github.io/lalit-op/posts/" 
            class="fullscreen-iframe"
            title="Stock Samvad AI Market Reports"
            allow="clipboard-read; clipboard-write; display-capture; fullscreen"
            allowfullscreen
            referrerpolicy="origin"
        ></iframe>
    </div>

</body>
</html>
